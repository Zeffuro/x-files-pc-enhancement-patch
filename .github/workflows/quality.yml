name: Source checks

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install clang-format==22.1.3
      - name: Formatting
        run: find src tests tools -type f \( -name '*.cpp' -o -name '*.h' \) -print0 | xargs -0 clang-format --dry-run --Werror
      - name: Package checker tests
        run: python tests/package_check.py
      - name: DVD media inventory tests
        run: python tests/dvd_media_probe.py
      - name: DVD registration tests
        run: python tests/dvd_registration.py
      - name: Portable tests
        run: |
          mkdir -p /tmp/xfiles-checks
          g++ -std=c++20 -Wall -Wextra -Werror -Isrc tests/controller_profile_portable.cpp -o /tmp/xfiles-checks/controller-profile
          /tmp/xfiles-checks/controller-profile
          g++ -std=c++20 -Wall -Wextra -Werror -Isrc tests/transcript_history.cpp -o /tmp/xfiles-checks/transcript-history
          /tmp/xfiles-checks/transcript-history
          g++ -std=c++20 -Wall -Wextra -Werror -Isrc tests/audio_edits.cpp -o /tmp/xfiles-checks/audio-edits
          /tmp/xfiles-checks/audio-edits
          g++ -std=c++20 -Wall -Wextra -Werror -Isrc tests/log_file.cpp src/diagnostics/log_file.cpp -o /tmp/xfiles-checks/log-file
          /tmp/xfiles-checks/log-file
          g++ -std=c++20 -Wall -Wextra -Werror -Isrc tests/installation.cpp src/launcher/configuration.cpp src/setup/destination.cpp -o /tmp/xfiles-checks/installation
          /tmp/xfiles-checks/installation
      - name: Script syntax
        run: |
          bash -n tools/build-ffmpeg.sh
          python -m compileall -q tools tests

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y clang libclang-rt-dev g++-multilib zlib1g-dev:i386
      - run: >-
          cmake -S tests/fuzz -B build/fuzz -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_CXX_FLAGS=-m32 -DCMAKE_EXE_LINKER_FLAGS=-m32
          -DZLIB_LIBRARY=/usr/lib/i386-linux-gnu/libz.so -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - run: cmake --build build/fuzz --parallel 2
      - run: python3 tests/fuzz/seeds.py build/fuzz/corpus
      - name: Bounded sanitizer fuzzing
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          for parser in movie picture save; do
            build/fuzz/$parser build/fuzz/corpus/$parser -max_total_time=45 -timeout=5 -rss_limit_mb=1024 -max_len=65536
          done
